<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>❌⭕️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
function showErr(msg){
  var bar = document.getElementById('errBar');
  var txt = document.getElementById('errText');
  if(!bar || !txt) return;
  txt.textContent = '⚠️ ত্রুটি: ' + msg;
  bar.style.display = 'block';
}
function hideErr(){
  var bar = document.getElementById('errBar');
  if(bar) bar.style.display = 'none';
}
window.addEventListener('error', function(e){
  var msg = (e && e.message) ? e.message : '';
  if(!msg || msg === 'Script error.'){
    console.warn('[XO] opaque script error ignored');
    return;
  }
  showErr(msg + (e.lineno ? ' (লাইন ' + e.lineno + ')' : ''));
});
window.addEventListener('unhandledrejection', function(e){
  var r = e.reason;
  var m = (r && r.message) ? r.message : (r ? String(r) : '');
  if(!m || m === 'Script error.'){
    console.warn('[XO] opaque rejection ignored');
    return;
  }
  showErr(m);
});
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
:root{--x:#ff5d7a;--o:#4fd1ff;--gold:#ffd166}
html,body{height:100%}
body{font-family:'Poppins','Noto Sans Bengali',system-ui,sans-serif;color:#fff;background:#14102b;overflow:hidden;min-height:100vh;min-height:100dvh}

/* error bar */
#errBar{position:fixed;top:0;left:0;right:0;z-index:999;background:#b00020;color:#fff;font-size:13px;padding:9px 40px 9px 12px;display:none;text-align:center;line-height:1.4}
#errBar button{position:absolute;right:6px;top:4px;background:none;border:none;color:#fff;font-size:16px;padding:4px 8px;cursor:pointer}

/* background */
.bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#1b1040,#2d1b5e,#0f3b5c,#3a1c52);background-size:300% 300%;animation:bgShift 16s ease infinite;overflow:hidden}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:float 14s ease-in-out infinite}
.b1{width:320px;height:320px;background:#ff5d7a;top:-80px;left:-80px}
.b2{width:360px;height:360px;background:#4fd1ff;bottom:-120px;right:-100px;animation-delay:-5s}
.b3{width:240px;height:240px;background:#a06bff;top:40%;left:45%;animation-delay:-9s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.1)}}

/* screens */
.screen{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.screen.active{display:flex}
.card{width:min(92vw,400px);padding:28px 22px;border-radius:28px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .5s ease}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.logo{width:130px;height:auto;margin:0 auto;display:block;filter:drop-shadow(0 0 12px rgba(255,93,122,.55))}
.title{font-size:22px;font-weight:700}
.sub{opacity:.85;font-size:15px}
.hint{font-size:13px;color:#ffb3c1;min-height:22px;display:flex;align-items:center;justify-content:center;gap:6px}
.divider{font-size:13px;opacity:.6}
.btn{font-family:inherit;font-size:16px;font-weight:700;padding:15px 18px;border:none;border-radius:18px;color:#fff;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 10px 25px rgba(0,0,0,.25);width:100%;display:inline-flex;align-items:center;justify-content:center;gap:10px;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5}
.btn-primary{background:linear-gradient(135deg,#ff5d7a,#ff8a5c)}
.btn-secondary{background:linear-gradient(135deg,#7c5cff,#4fd1ff)}
.btn-info{background:linear-gradient(135deg,#4fd1ff,#4a8bff)}
.btn-ghost{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);box-shadow:none}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1;padding:14px 12px;font-size:15px}
.input{width:100%;padding:14px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;font:inherit;font-size:16px;outline:none;text-align:center}
.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,209,102,.25)}
.code-input{font-size:26px;letter-spacing:.5em;font-weight:700;text-indent:.5em}
.room-code-box{font-size:44px;font-weight:800;letter-spacing:.3em;padding:18px;border-radius:20px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,209,102,.6);color:var(--gold);text-indent:.3em}
.link-preview{font-size:12px;color:#ffe9a8;background:rgba(0,0,0,.25);padding:10px;border-radius:14px;word-break:break-all;min-height:20px}
.loader{width:34px;height:34px;margin:6px auto;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;gap:4px;transition:transform .2s,border-color .3s}
.stat-box span{font-size:26px;font-weight:800}
.stat-box small{opacity:.75;font-size:12px}

/* Premium Animated Button Icons */
.btn-icon-box{
  width:26px;height:26px;
  display:inline-flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;
  background:rgba(255,255,255,.18);
  border-radius:8px;padding:4px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.18);
  transform-origin:center;
}
.btn-icon-box svg{
  width:100%;height:100%;
  fill:none;stroke:#fff;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  overflow:visible;
}

/* Menu Icons Idle Subtle Animations */
.anim-bot .bot-antenna{animation:botSignal 2.2s ease-in-out infinite;transform-origin:12px 6px}
.anim-bot .bot-eye{animation:botBlink 3.6s ease-in-out infinite;transform-origin:center}
@keyframes botSignal{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-1.5px)}
}
@keyframes botBlink{
  0%,44%,52%,100%{transform:scaleY(1)}
  48%{transform:scaleY(0.15)}
}

.anim-duo .duo-back{animation:duoSway 3s ease-in-out infinite}
@keyframes duoSway{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(1.5px)}
}

.anim-globe .globe-ring{animation:globeSpin 5s linear infinite;transform-origin:12px 12px}
@keyframes globeSpin{
  0%{transform:scaleX(1)}
  50%{transform:scaleX(0.45)}
  100%{transform:scaleX(1)}
}

.anim-user .user-head{animation:userNod 2.8s ease-in-out infinite}
@keyframes userNod{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-1.3px)}
}

/* Difficulty, Online, Profile & Result Icons Idle Animations */
.anim-smile .smile-face{animation:smileFloat 2.6s ease-in-out infinite;transform-origin:center}
@keyframes smileFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-1.3px) scale(1.06)}
}

.anim-brain .brain-spark{animation:brainPulse 2.2s ease-in-out infinite;transform-origin:center}
@keyframes brainPulse{
  0%,100%{opacity:.55;transform:scale(.92)}
  50%{opacity:1;transform:scale(1.12)}
}

.anim-fire .fire-inner{animation:fireFlicker 1.4s ease-in-out infinite;transform-origin:12px 18px}
@keyframes fireFlicker{
  0%,100%{transform:scaleY(1) skewX(0deg)}
  35%{transform:scaleY(1.14) skewX(-5deg)}
  70%{transform:scaleY(.92) skewX(5deg)}
}

.anim-plus .plus-cross{animation:plusPulse 2.8s ease-in-out infinite;transform-origin:12px 12px}
@keyframes plusPulse{
  0%,100%{transform:rotate(0deg) scale(1)}
  50%{transform:rotate(90deg) scale(1.08)}
}

.anim-door .door-arrow{animation:doorEnter 2.2s ease-in-out infinite}
@keyframes doorEnter{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(2.4px)}
}

.anim-back .back-arrow{animation:backSlide 2.2s ease-in-out infinite}
@keyframes backSlide{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-2.4px)}
}

.anim-replay .replay-spin{animation:replayRock 3s ease-in-out infinite;transform-origin:12px 12px}
@keyframes replayRock{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(24deg)}
}

.anim-home .home-roof{animation:homeLift 2.6s ease-in-out infinite;transform-origin:center}
@keyframes homeLift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-1.3px)}
}

.anim-edit .edit-pen{animation:penWrite 2.4s ease-in-out infinite;transform-origin:17px 7px}
@keyframes penWrite{
  0%,100%{transform:translate(0,0) rotate(0deg)}
  40%{transform:translate(-1.5px,1.5px) rotate(-8deg)}
  70%{transform:translate(1px,-1px) rotate(4deg)}
}

.anim-trash .trash-lid{animation:trashLidLift 2.6s ease-in-out infinite;transform-origin:5px 7px}
@keyframes trashLidLift{
  0%,100%{transform:rotate(0deg)}
  50%{transform:rotate(-14deg) translateY(-1px)}
}

.anim-close .close-x{animation:closePulse 2.8s ease-in-out infinite;transform-origin:12px 12px}
@keyframes closePulse{
  0%,100%{transform:scale(1) rotate(0deg)}
  50%{transform:scale(1.12) rotate(90deg)}
}

/* Status Pill Badge (Profile Message) */
.status-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:999px;
  font-size:12.5px;font-weight:600;
  animation:statusPop .35s cubic-bezier(.34,1.56,.64,1);
}
.status-badge.ok{
  background:rgba(34,197,94,.2);
  border:1px solid rgba(74,222,128,.45);
  color:#86efac;
}
.status-badge.warn{
  background:rgba(255,93,122,.2);
  border:1px solid rgba(255,93,122,.45);
  color:#ffb3c1;
}
.status-badge svg{
  width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;
  animation:drawCheck .35s ease forwards .05s;
}
@keyframes statusPop{
  0%{opacity:0;transform:scale(.82) translateY(4px)}
  100%{opacity:1;transform:none}
}

/* Tap Wiggle / Spring Shake Animation on Buttons */
.btn.is-tapped .btn-icon-box{
  animation:iconTapWiggle .48s cubic-bezier(.34,1.56,.64,1);
  background:rgba(255,255,255,.32);
  box-shadow:0 0 14px rgba(255,255,255,.55);
}
@keyframes iconTapWiggle{
  0%{transform:scale(1) rotate(0deg) translateY(0)}
  20%{transform:scale(1.26) rotate(-14deg) translateY(-3px)}
  45%{transform:scale(1.22) rotate(12deg) translateY(-2px)}
  70%{transform:scale(1.1) rotate(-6deg) translateY(0)}
  100%{transform:scale(1) rotate(0deg) translateY(0)}
}

/* Waiting Screen Icons Idle Subtle Animations */
.anim-copy .copy-front{animation:copyFloat 2.6s ease-in-out infinite}
@keyframes copyFloat{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(1.5px,-1.5px)}
}
.anim-link .link-part1{animation:linkPulse1 2.8s ease-in-out infinite}
.anim-link .link-part2{animation:linkPulse2 2.8s ease-in-out infinite}
@keyframes linkPulse1{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(-1px,1px)}
}
@keyframes linkPulse2{
  0%,100%{transform:translate(0,0)}
  50%{transform:translate(1px,-1px)}
}
.anim-share .share-arrow{animation:shareLift 2.2s ease-in-out infinite}
@keyframes shareLift{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-2.5px)}
}

/* Success checkmark state */
.btn .icon-check{display:none}
.btn.is-done .icon-main{display:none}
.btn.is-done .icon-check{display:block}
.btn.is-done .btn-icon-box{
  background:rgba(34,197,94,.35);
  box-shadow:0 0 12px rgba(74,222,128,.6);
  animation:popCheck .35s cubic-bezier(.2,.9,.3,1.3);
}
.btn.is-done .icon-check path{
  stroke:#86efac;stroke-width:2.8;
  stroke-dasharray:24;stroke-dashoffset:24;
  animation:drawCheck .35s ease forwards .05s;
}
@keyframes popCheck{0%{transform:scale(.7)}100%{transform:scale(1)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}

/* Shimmer sweep on buttons */
.btn-shine::after{
  content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transform:skewX(-20deg);
  animation:btnSweep 4.2s ease-in-out infinite;
  pointer-events:none;
}
@keyframes btnSweep{
  0%,65%{left:-100%}
  100%{left:160%}
}

/* game header */
.game-wrap{width:min(94vw,440px);display:flex;flex-direction:column;align-items:center;gap:14px}
.game-header{width:100%;display:flex;align-items:center;gap:8px}
.players{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.player{flex:1;min-width:0;padding:8px 6px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid transparent;font-size:13px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:all .3s}
.player.active{border-color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.35)}
#rightPlayer{text-align:right}
.score-pill{padding:6px 10px;border-radius:999px;background:rgba(0,0,0,.3);font-weight:800;font-size:13px;white-space:nowrap}
.header-actions{display:flex;gap:6px}
.icon-btn{position:relative;width:40px;height:40px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#ff3b5c;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.turn-indicator{font-size:15px;font-weight:600;min-height:22px;color:#ffe9a8}

/* board */
.board-wrap{width:100%;display:flex;justify-content:center}
.board{position:relative;width:min(86vw,360px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3%}
.cell{position:relative;width:100%;height:100%;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center;padding:0;font:inherit;color:inherit;transition:background .2s,transform .15s,border-color .3s,box-shadow .3s}
.cell:hover{background:rgba(255,255,255,.14)}
.cell:active{transform:scale(.96)}
.cell.win-cell{background:rgba(255,209,102,.18);border-color:var(--gold);box-shadow:0 0 22px rgba(255,209,102,.45)}
.mark-x,.mark-o{width:62%;height:62%;fill:none;stroke-width:10;stroke-linecap:round;overflow:visible}
.mark-x{stroke:var(--x);color:var(--x)}
.mark-o{stroke:var(--o);color:var(--o)}
.mark-x,.mark-o{filter:drop-shadow(0 0 8px currentColor)}
.mark-x line{stroke-dasharray:130;stroke-dashoffset:130;animation:drawIn .4s ease forwards}
.mark-x line:last-child{animation-delay:.18s}
.mark-o circle{stroke-dasharray:185;stroke-dashoffset:185;animation:drawIn .5s ease forwards}
@keyframes drawIn{to{stroke-dashoffset:0}}
.win-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
.win-line{stroke:var(--gold);stroke-width:2.4;stroke-linecap:round;opacity:0;stroke-dasharray:160;stroke-dashoffset:160;filter:drop-shadow(0 0 6px var(--gold))}
.win-line.show{opacity:1;animation:winDraw .6s ease forwards}
@keyframes winDraw{to{stroke-dashoffset:0}}

/* result overlays */
.result-overlay{position:fixed;inset:0;z-index:120;background:rgba(8,5,24,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.result-overlay.show{opacity:1;pointer-events:auto}
.left-overlay{z-index:130}
.result-card{width:min(88vw,360px);padding:26px 20px;border-radius:26px;background:rgba(30,22,60,.92);border:1px solid rgba(255,255,255,.2);text-align:center;display:flex;flex-direction:column;gap:14px;transform:scale(.9);transition:transform .35s}
.result-overlay.show .result-card{transform:none}
.result-card h2{font-size:21px}

/* Premium Animated Result Hero Badges */
.result-hero{
  width:78px;height:78px;margin:0 auto;
  border-radius:24px;
  display:grid;place-items:center;
  position:relative;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 12px 30px rgba(0,0,0,.35), inset 0 1px 1px rgba(255,255,255,.35);
}
.result-hero::before{
  content:'';position:absolute;inset:-6px;border-radius:28px;
  border:1.5px solid rgba(255,255,255,.25);
  animation:heroHalo 2.2s ease-out infinite;
  pointer-events:none;
}
@keyframes heroHalo{
  0%{transform:scale(.92);opacity:.75}
  100%{transform:scale(1.18);opacity:0}
}
.result-hero svg{
  width:42px;height:42px;
  fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;
  overflow:visible;
}
.result-overlay.show .result-hero{
  animation:heroEntrance .55s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes heroEntrance{
  0%{transform:scale(.4) rotate(-12deg);opacity:0}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}

/* Win Hero */
.hero-win{
  background:radial-gradient(circle at 30% 25%, rgba(255,209,102,.32), rgba(255,93,122,.16));
  border-color:rgba(255,209,102,.55);
  box-shadow:0 12px 32px rgba(255,209,102,.28), inset 0 1px 1px rgba(255,255,255,.45);
}
.hero-win::before{border-color:rgba(255,209,102,.5)}
.hero-win svg{stroke:var(--gold);filter:drop-shadow(0 0 10px rgba(255,209,102,.65))}
.hero-win .trophy-body{animation:trophyFloat 2.4s ease-in-out infinite;transform-origin:12px 12px}
.hero-win .spark-1{animation:sparkTwinkle 1.6s ease-in-out infinite;transform-origin:center}
.hero-win .spark-2{animation:sparkTwinkle 1.6s ease-in-out infinite .55s;transform-origin:center}
@keyframes trophyFloat{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(-2.5px) rotate(-3deg)}
}
@keyframes sparkTwinkle{
  0%,100%{opacity:.25;transform:scale(.7)}
  50%{opacity:1;transform:scale(1.25)}
}

/* Draw Hero */
.hero-draw{
  background:radial-gradient(circle at 30% 25%, rgba(79,209,255,.32), rgba(160,107,255,.18));
  border-color:rgba(79,209,255,.55);
  box-shadow:0 12px 32px rgba(79,209,255,.25), inset 0 1px 1px rgba(255,255,255,.45);
}
.hero-draw::before{border-color:rgba(79,209,255,.5)}
.hero-draw svg{stroke:var(--o);filter:drop-shadow(0 0 10px rgba(79,209,255,.65))}
.hero-draw .draw-ring{animation:drawSpin 6s linear infinite;transform-origin:12px 12px}
.hero-draw .draw-bars{animation:drawTilt 2.4s ease-in-out infinite;transform-origin:12px 12px}
@keyframes drawSpin{to{transform:rotate(360deg)}}
@keyframes drawTilt{
  0%,100%{transform:rotate(0deg)}
  25%{transform:rotate(-8deg)}
  75%{transform:rotate(8deg)}
}

/* Lose Hero */
.hero-lose{
  background:radial-gradient(circle at 30% 25%, rgba(255,93,122,.32), rgba(160,107,255,.16));
  border-color:rgba(255,93,122,.5);
  box-shadow:0 12px 32px rgba(255,93,122,.24), inset 0 1px 1px rgba(255,255,255,.35);
}
.hero-lose::before{border-color:rgba(255,93,122,.45)}
.hero-lose svg{stroke:#ff8fa3;filter:drop-shadow(0 0 10px rgba(255,93,122,.6))}
.hero-lose .lose-face{animation:loseSigh 2.8s ease-in-out infinite;transform-origin:12px 12px}
@keyframes loseSigh{
  0%,100%{transform:translateY(0) rotate(0deg)}
  50%{transform:translateY(2px) rotate(-4deg)}
}

/* Next Starter Pill */
.next-starter-note{
  font-size:13.5px;color:#ffe9a8;
  background:rgba(0,0,0,.28);
  border:1px solid rgba(255,209,102,.2);
  padding:10px 12px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.next-arrow-badge{
  width:22px;height:22px;border-radius:7px;
  background:rgba(255,209,102,.18);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.next-arrow-badge svg{
  width:14px;height:14px;fill:none;stroke:var(--gold);stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round;
  animation:nextSlide 1.5s ease-in-out infinite;
}
@keyframes nextSlide{
  0%,100%{transform:translateX(-1.5px)}
  50%{transform:translateX(2px)}
}

/* chat */
.chat-drawer{position:fixed;inset:0;z-index:200;pointer-events:none}
.chat-drawer.open{pointer-events:auto}
.chat-overlay{position:absolute;inset:0;background:rgba(5,3,20,.55);opacity:0;transition:opacity .3s}
.chat-drawer.open .chat-overlay{opacity:1}
.chat-panel{position:absolute;left:0;right:0;bottom:0;height:72vh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:rgba(22,16,48,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.2);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:14px 14px 18px}
.chat-drawer.open .chat-panel{transform:none}
.chat-head{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:16px;padding:0 4px 10px}
.chat-messages{flex:1;overflow-y:auto;padding:6px 4px;display:flex;flex-direction:column}
.chat-msg{max-width:78%;padding:9px 12px;border-radius:16px;margin:4px 0;font-size:14px;line-height:1.45;overflow-wrap:anywhere;background:rgba(255,255,255,.12)}
.chat-msg.me{align-self:flex-end;background:linear-gradient(135deg,#ff5d7a,#ff8a5c)}
.chat-msg .who{display:block;font-size:11px;opacity:.75;margin-bottom:2px}
.chat-meta{display:block;font-size:10px;opacity:.85;margin-top:3px;text-align:right}
.chat-status.seen{color:#7fd8ff;font-weight:700}
.chat-system{align-self:center;font-size:12px;margin:8px 0;color:#ffd6dd;opacity:.85;text-align:center}
.chat-emojis{display:flex;gap:4px;padding:8px 0}
.chat-emojis button{flex:1;font-size:20px;padding:6px 0;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);cursor:pointer}
.chat-input-row{display:flex;gap:8px;align-items:center}
.chat-input-row .input{text-align:left;padding:12px 14px}
.chat-send{width:auto;padding:12px 16px;border-radius:14px}
.chat-toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-160%);z-index:150;background:rgba(22,16,48,.94);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:10px 16px;font-size:14px;max-width:90vw;transition:transform .35s;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-toast.show{transform:translate(-50%,0)}

/* confetti */
.confetti-piece{position:fixed;top:-20px;width:10px;height:14px;z-index:300;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}
</style>
</head>

      <div class="result-hero hero-lose">
        <svg viewBox="0 0 24 24">
          <path d="M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"/>
          <polyline points="16 17 21 12 16 7"/>

function beep(freq, dur, type){
  if(!soundOn) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

}

/* ================= GAME LOGIC ================= */
function checkWinner(b){
  for(const combo of WIN_COMBOS){
    const [x,y,z] = combo;
    if(b[x] && b[x] === b[y] && b[x] === b[z]) return { winner: b[x], combo };
  }
  if(b.every(Boolean)) return { winner:'draw', combo:null };
  return null;
}
function minimax(b, computerTurn, depth){
  const r = checkWinner(b);
  if(r){
    if(r.winner === 'draw') return 0;
    return r.winner === computerSymbol ? 10 - depth : depth - 10;
  }
  let best = computerTurn ? -Infinity : Infinity;
  for(let i=0;i<9;i++){
    if(b[i]) continue;
    b[i] = computerTurn ? computerSymbol : humanSymbol;
    const s = minimax(b, !computerTurn, depth + 1);
    b[i] = '';
    best = computerTurn ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}
function bestMove(b){
  let best = -Infinity, move = -1;
  for(let i=0;i<9;i++){
    if(b[i]) continue;
    b[i] = computerSymbol;
    const s = minimax(b, false, 1);
    b[i] = '';
    if(s > best){ best = s; move = i; }
  }
  return move;
}
function randomMove(b){
  const empty = [];
  b.forEach((v,i) => { if(!v) empty.push(i); });
  return empty[Math.floor(Math.random() * empty.length)];
}
function pickComputerMove(){
  const b = board.slice();
  if(level === 'easy') return randomMove(b);
  if(level === 'medium' && Math.random() < 0.4) return randomMove(b);

}

}

function copyText(text, cb){
  const fallback = () => {
    try{
      const t = document.createElement('textarea');
      t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
      document.body.appendChild(t); t.select();
      const okc = document.execCommand('copy');
      t.remove();
      cb(!!okc);
    }catch(e){ cb(false); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => cb(true), fallback);
  } else fallback();
}
function flashBtn(btn, okText, ok, origText){
  const lbl = btn.querySelector('.btn-label');
  clearTimeout(btn._t);
  if(ok){
    btn.classList.add('is-done');
    if(lbl) lbl.textContent = okText;
  } else {
    if(lbl) lbl.textContent = '❌ কপি হয়নি';
  }
  btn._t = setTimeout(() => {
    btn.classList.remove('is-done');
    if(lbl) lbl.textContent = origText;
  }, 1700);
}
function buildRoomLink(code){
  const base = location.href.split('#')[0].split('?')[0];
  return `${base}?room=${code}`;
}
function copyRoomCode(){
  if(!onlineCode) return;
  const btn = $('copyBtn');
  copyText(onlineCode, ok => flashBtn(btn, 'কপি হয়েছে!', ok, 'কোড কপি করুন'));
}
function copyRoomLink(){
  if(!onlineCode) return;
  const btn = $('linkBtn');
  const link = buildRoomLink(onlineCode);
  $('linkPreview').textContent = link;
  copyText(link, ok => flashBtn(btn, 'লিংক কপি হয়েছে!', ok, 'লিংক কপি করুন'));
}
function shareRoomLink(){
  if(!onlineCode) return;
  const btn = $('shareBtn');
  const link = buildRoomLink(onlineCode);
  if(navigator.share){
    navigator.share({
      title: 'XO খেলা',
      text: `আমার সাথে XO খেলুন! রুম কোড: ${onlineCode}`,
      url: link
    }).then(() => {
      flashBtn(btn, 'শেয়ার হয়েছে!', true, 'শেয়ার করুন');
    }).catch(() => {});
  } else {
    copyRoomLink();
  }
}
function readRoomParam(){
  try{
    const p = new URLSearchParams(location.search).get('room');
    if(p && /^\d{4}$/.test(p)) pendingRoomCode = p;
    if(p && window.history && history.replaceState) history.replaceState(null, '', location.pathname);
  }catch(e){}
}
function applyPendingRoom(){
  if(!pendingRoomCode) return false;
  $('joinCodeInput').value = pendingRoomCode;
  pendingRoomCode = null;
  setOnlineMsg('লিংক থেকে রুম কোড এসেছে। "রুমে যোগ দিন" চাপুন।');
  showScreen('screen-online');
  return true;
}

/* ================= ONLINE ================= */
function requireDb(){
  if(!db){ setOnlineMsg('অনলাইন সার্ভিস চালু হয়নি। ইন্টারনেট চেক করুন।'); return false; }
  return true;
}
async function createRoom(){
  if(!requireDb()) return;
  setOnlineMsg('');
  try{
    let code = null;
    for(let t=0; t<10 && !code; t++){
      const c = String(1000 + Math.floor(Math.random() * 9000));
      const s = await db.ref('rooms/' + c).once('value');
      if(!s.exists()) code = c;
    }
    if(!code){ setOnlineMsg('রুম তৈরি করা যাচ্ছে না, আবার চেষ্টা করুন'); return; }
    await db.ref('rooms/' + code).set({
      board: ['','','','','','','','',''],
      turn: 'X',
      xRole: 'HOST',
      nextXRole: 'HOST',
      round: 1,
      players: { HOST: profile.name || 'হোস্ট' },
      presence: { HOST: true, GUEST: false },
      status: 'waiting',
      createdAt: Date.now()
    });
    onlineCode = code;
    myRole = 'HOST';
    xRole = 'HOST';
    $('roomCodeDisplay').textContent = code;
    $('linkPreview').textContent = buildRoomLink(code);
    $('shareBtn').hidden = !navigator.share;
    showScreen('screen-waiting');
    attachRoomListener(code);
    setupPresence();
  }catch(e){
    setOnlineMsg('ত্রুটি: ' + (e.message || e));
  }
}
async function joinRoom(){
  if(!requireDb()) return;
  const code = $('joinCodeInput').value.trim();
  if(!/^\d{4}$/.test(code)){ setOnlineMsg('৪ সংখ্যার সঠিক কোড লিখুন'); return; }
  setOnlineMsg('যোগ দেওয়া হচ্ছে...');
  try{
    const ref = db.ref('rooms/' + code);
    const snap = await ref.once('value');
    const room = snap.val();
    if(!room){ setOnlineMsg('এই কোডে কোনো রুম নেই'); return; }
    if(room.status !== 'waiting' || (room.players && room.players.GUEST)){
      setOnlineMsg('রুমটি ভর্তি বা বন্ধ হয়ে গেছে'); return;
    }
    if(room.presence && room.presence.HOST === false){
      setOnlineMsg('রুমের হোস্ট এখন অফলাইনে আছেন। একটু পরে আবার চেষ্টা করুন।'); return;
    }
    onlineCode = code;
    myRole = 'GUEST';
    await ref.update({
      'players/GUEST': profile.name || 'খেলোয়াড়',
      'presence/GUEST': true,
      status: 'playing'
    });
    attachRoomListener(code);
    setupPresence();
    setOnlineMsg('');
  }catch(e){
    setOnlineMsg('ত্রুটি: ' + (e.message || e));
    onlineCode = null;
  }
}
function attachRoomListener(code){
  roomRef = db.ref('rooms/' + code);
  roomRef.on('value', snap => onRoomUpdate(snap.val()), err => showErr(err.message));
}
function setupPresence(){
  if(!onlineCode) return;
  presRef = db.ref(`rooms/${onlineCode}/presence/${myRole}`);
  connRef = db.ref('.info/connected');
  connFn = snap => {
    if(snap.val() !== true) return;
    presRef.onDisconnect().set(false);
    presRef.set(true);
  };
  connRef.on('value', connFn);
}
function detachOnlineListeners(){
  if(roomRef){ roomRef.off(); roomRef = null; }
  if(chatRef){ chatRef.off(); chatRef = null; }
  if(readRef){ readRef.off(); readRef = null; }
  if(connRef && connFn) connRef.off('value', connFn);
  if(presRef){ presRef.onDisconnect().cancel(); presRef = null; }
  connRef = null; connFn = null;
  clearTimeout(oppGraceTimer); oppGraceTimer = null;
}
function leaveOnlineRoom(){
  if(!onlineCode || !db) return;
  const code = onlineCode;
  const role = myRole;
  detachOnlineListeners();
  const ref = db.ref('rooms/' + code);
  if(role === 'HOST'){
    ref.remove().catch(() => {});
  } else {
    ref.once('value').then(s => {
      if(s.exists()){
        ref.update({ status:'closed', leftBy: role, ['presence/' + role]: false }).catch(() => {});
      }
    }).catch(() => {});
  }
}
function resetOnlineState(){
  onlineCode = null;
  roomData = null;
  inOnlineGame = false;
  onlineLeft = false;
  busy = false;
  curRound = 0;
  myRole = 'HOST';
  chatInitDone = false;
  lastChatKey = '';
  oppReadKey = '';
  unread = 0;
  chatOpen = false;
  renderedKeys.clear();
  $('chatMessages').innerHTML = '';
  $('chatBadge').hidden = true;
  $('chatDrawer').classList.remove('open');
  $('chatToast').classList.remove('show');
  $('chatBtn').hidden = true;
  $('leftOverlay').classList.remove('show');
  $('linkPreview').textContent = '';
}
function cancelRoom(){
  leaveOnlineRoom();
  resetOnlineState();
  renderMenu();
  showScreen('screen-menu');
}
function onRoomUpdate(room){
  if(!onlineCode) return;
  if(!room){
    if(inOnlineGame) onOpponentLeft();
    return;
  }
  roomData = room;
  busy = false;
  xRole = room.xRole || 'HOST';

  if(!inOnlineGame){
    if(room.status === 'playing') enterOnlineGameScreen();
    return;
  }

  if(room.status === 'closed' && room.leftBy && room.leftBy !== myRole){
    onOpponentLeft();
    return;
  }
  checkOpponentPresence(room);

  const rd = room.round || 1;
  const b = normalizeBoard(room.board);
  if(rd !== curRound){
    curRound = rd;
    resetBoardUI();
  } else if(resultShown && b.every(v => !v)){
    resetBoardUI();
  }

  board = b;
  paintBoard();

  if(room.status === 'finished' && room.winner){
    if(!resultShown) showOnlineResult(room);
  } else if(room.status === 'playing'){
    gameOver = false;
    currentTurn = room.turn || 'X';
  }
  updateTurn();
}
function enterOnlineGameScreen(){
  const room = roomData;
  inOnlineGame = true;
  mode = 'online';
  onlineLeft = false;
  busy = false;
  curRound = room.round || 1;
  xRole = room.xRole || 'HOST';
  board = normalizeBoard(room.board);
  gameOver = false;
  resultShown = false;
  currentTurn = room.turn || 'X';
  clearWinVisuals();
  paintBoard();
  hideResultOverlay();
  setupOnlineHeader();
  attachChat(onlineCode);
  showScreen('screen-game');
  updateTurn();
}
function setupOnlineHeader(){
  $('chatBtn').hidden = false;
  $('chatBadge').hidden = true;
}
function checkOpponentPresence(room){
  if(!inOnlineGame || onlineLeft) return;
  if(room.status !== 'playing' && room.status !== 'finished'){
    clearTimeout(oppGraceTimer); oppGraceTimer = null;
    return;
  }
  const opp = otherRole(myRole);
  const online = !!(room.presence && room.presence[opp] === true);
  if(online){
    clearTimeout(oppGraceTimer); oppGraceTimer = null;
    return;
  }
  if(!oppGraceTimer){
    oppGraceTimer = setTimeout(() => {
      oppGraceTimer = null;
      const p = roomData && roomData.presence && roomData.presence[otherRole(myRole)];
      if(p !== true) onOpponentLeft();
    }, 7000);
  }
}
function onOpponentLeft(){
  if(!inOnlineGame || onlineLeft) return;
  onlineLeft = true;
  clearTimeout(oppGraceTimer); oppGraceTimer = null;
  appendSystemMessage('⚠️ প্রতিপক্ষ গেম ছেড়ে চলে গেছে');
  $('leftOverlay').classList.add('show');
  updateTurn();
}
function showOnlineResult(room){
  const w = room.winner;
  const rx = room.xRole || 'HOST';
  gameOver = true;
  let combo = null;
  if(Array.isArray(room.winCombo)) combo = room.winCombo;
  else if(room.winCombo && typeof room.winCombo === 'object') combo = Object.values(room.winCombo);
  if(combo && w !== 'draw') highlightWin(combo);

  const winRole = w === 'draw' ? null : (w === 'X' ? rx : otherRole(rx));

  if(w === 'draw') profile.draws++;
  else if(winRole === myRole) profile.wins++;
  else profile.losses++;
  saveProfile();

  let heroType, text;
  if(w === 'draw'){ heroType = 'draw'; text = 'ড্র হয়েছে!'; playMelody('draw'); }
  else if(winRole === myRole){ heroType = 'win'; text = 'আপনি জিতেছেন!'; playMelody('win'); launchConfetti(); }
  else { heroType = 'lose'; text = `${nameOf(winRole)} জিতেছে`; playMelody('lose'); }

  const nxt = room.nextXRole || (w === 'draw' ? otherRole(rx) : winRole);
  showResultOverlay(heroType, text, `${nameOf(nxt)} (X)`);
  updateTurn();
}
function makeOnlineMove(i){
  if(!roomRef || busy || onlineLeft || gameOver || resultShown) return;
  if(currentTurn !== mySymbol() || board[i]) return;
  busy = true;
  const me = myRole;
  roomRef.transaction(room => {
    if(!room || room.status !== 'playing') return;
    const rx = room.xRole || 'HOST';
    const mover = rx === me ? 'X' : 'O';
    if(room.turn !== mover) return;
    const b = normalizeBoard(room.board);
    if(b[i]) return;
    b[i] = mover;
    const upd = Object.assign({}, room, { board: b, turn: other(mover) });
    const r = checkWinner(b);
    if(r){
      upd.status = 'finished';
      upd.winner = r.winner;
      upd.winCombo = r.combo;
      // জয়ী (বা ড্র হলে বিপরীত পক্ষ) পরের রাউন্ডে X পাবে
      upd.nextXRole = r.winner === 'X' ? rx : otherRole(rx);
    }
    return upd;
  }).then(res => {
    if(!res.committed) busy = false;
  }).catch(() => { busy = false; });
}
function onlinePlayAgain(){
  if(!roomRef) return;
  roomRef.transaction(room => {
    if(!room || room.status !== 'finished') return;
    const nx = room.nextXRole || room.xRole || 'HOST';
    return Object.assign({}, room, {
      board: ['','','','','','','','',''],
      turn: 'X',
      xRole: nx,
      nextXRole: nx,
      round: (room.round || 1) + 1,
      status: 'playing',
      winner: null,
      winCombo: null
    });
  }).catch(() => {});
}

/* ================= CHAT ================= */
function attachChat(code){
  chatRef = db.ref(`rooms/${code}/chat`);
  readRef = db.ref(`rooms/${code}/read`);
  chatInitDone = false;
  chatRef.on('child_added', snap => onChatMessage(snap.key, snap.val()));
  chatRef.once('value', () => { chatInitDone = true; });
  readRef.on('value', snap => {
    const d = snap.val() || {};
    oppReadKey = d[otherRole(myRole)] || '';
    applySeen();
  });
}
function onChatMessage(key, msg){
  if(!msg || renderedKeys.has(key)) return;
  renderedKeys.add(key);
  lastChatKey = key;
  const mine = msg.sender === myRole;
  appendChatBubble(key, msg, mine);
  if(!mine && chatInitDone){
    playSound('chat');
    if(chatOpen){
      markChatRead();
    } else {
      unread++;
      $('chatBadge').textContent = unread;
      $('chatBadge').hidden = false;
      showChatToast(msg);
    }
  }
}
function appendChatBubble(key, msg, mine){
  const box = $('chatMessages');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (mine ? 'me' : 'other');
  const time = new Date(msg.time || Date.now()).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  const who = mine ? '' : `<span class="who">${escapeHtml(msg.name || 'প্রতিপক্ষ')}</span>`;
  const status = mine ? ` · <span class="chat-status" data-key="${escapeHtml(key)}">✓ পাঠানো হয়েছে</span>` : '';
  div.innerHTML = `${who}<div>${escapeHtml(msg.text || '')}</div><span class="chat-meta">${time}${status}</span>`;
  box.appendChild(div);
  scrollChat();
  if(mine) applySeen();
}
function applySeen(){
  document.querySelectorAll('#chatMessages .chat-status[data-key]').forEach(el => {
    const seen = !!oppReadKey && el.dataset.key <= oppReadKey;
    el.classList.toggle('seen', seen);
    el.textContent = seen ? '✓✓ দেখা হয়েছে' : '✓ পাঠানো হয়েছে';
  });
}
function appendSystemMessage(text){
  const d = document.createElement('div');
  d.className = 'chat-system';
  d.textContent = text;
  $('chatMessages').appendChild(d);
  scrollChat();
}
function markChatRead(){
  if(!onlineCode || !lastChatKey || !db) return;
  db.ref(`rooms/${onlineCode}/read/${myRole}`).set(lastChatKey).catch(() => {});
}
function sendChatMessage(text){
  const t = String(text || '').trim().slice(0, 300);
  if(!t || !onlineCode || !chatRef) return;
  chatRef.push({ sender: myRole, name: profile.name || 'আমি', text: t, time: Date.now() }).catch(() => {});
}
function sendText(){
  const inp = $('chatInput');
  sendChatMessage(inp.value);
  inp.value = '';
  inp.focus();
}
function sendEmoji(el){ sendChatMessage(el.dataset.emoji); }
function openChat(){
  if(mode !== 'online' || !inOnlineGame) return;
  chatOpen = true;
  unread = 0;
  $('chatBadge').hidden = true;
  $('chatToast').classList.remove('show');
  $('chatDrawer').classList.add('open');
  markChatRead();
  scrollChat();
}
function closeChat(){
  chatOpen = false;
  $('chatDrawer').classList.remove('open');
}
function showChatToast(msg){
  const t = $('chatToast');
  t.textContent = `💬 ${msg.name || 'প্রতিপক্ষ'}: ${msg.text || ''}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

/* ================= ACTIONS / EVENTS ================= */
function triggerTapWiggle(el){
  el.classList.remove('is-tapped');
  void el.offsetWidth;
  el.classList.add('is-tapped');
  clearTimeout(el._tapT);
  el._tapT = setTimeout(() => el.classList.remove('is-tapped'), 500);
}
function onDocClick(e){
  const cell = e.target.closest && e.target.closest('#board .cell');
  if(cell){
    handleCellClick(Number(cell.dataset.index));
    return;
  }
  const el = e.target.closest && e.target.closest('[data-action]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(typeof fn !== 'function') return;

  if(el.dataset.tapAnim === '1'){
    triggerTapWiggle(el);
    setTimeout(() => fn(el), 240);
    return;
  }
  fn(el);
}
const ACTIONS = {
  saveName, goMenu, goDifficulty, goOnline, goProfile,
  startComputer, startLocal, createRoom, joinRoom, cancelRoom,
  copyRoomCode, copyRoomLink, shareRoomLink,
  updateProfileName, resetStats, exitGame, playAgain,
  openChat, closeChat, toggleSound, sendEmoji, sendText, hideErr
};
function bindKeys(){
  $('nameInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing) saveName();
  });
  $('joinCodeInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing) joinRoom();
  });
  $('joinCodeInput').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
  });
  $('chatInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); sendText(); }
  });
  $('profileNameInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.isComposing) updateProfileName();
  });
}

/* ================= INIT ================= */
function init(){
  try{
    if(typeof firebase !== 'undefined'){
      if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    }
  }catch(e){
    console.warn('[XO] Firebase init failed', e);
    db = null;
  }
  readRoomParam();
  cellEls = Array.from(document.querySelectorAll('#board .cell'));
  loadProfile();
  soundOn = store.get('xo_sound') !== '0';
  updateSoundBtn();
  document.addEventListener('click', onDocClick);
  bindKeys();
  renderMenu();
  if(!profile.name){
    showScreen('screen-name');
    return;
  }
  if(!applyPendingRoom()) showScreen('screen-menu');
}
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
